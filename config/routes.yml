# Rutas amigables OAuth y términos para el módulo Yuju actual.
# Las URLs estándar /module/yuju/oauth y /module/yuju/terms también se
# generan desde Link::getModuleLink() dentro de YujuOAuth y el controlador admin.

module_yuju_oauth:
    path: /yuju/oauth
    methods: [GET]
    defaults:
        _controller: 'PrestaShopBundle\Controller\ModuleFrontController::dispatch'
        module: 'yuju'
        controller: 'oauth'

module_yuju_terms:
    path: /yuju/terms
    methods: [GET]
    defaults:
        _controller: 'PrestaShopBundle\Controller\ModuleFrontController::dispatch'
        module: 'yuju'
        controller: 'terms'
